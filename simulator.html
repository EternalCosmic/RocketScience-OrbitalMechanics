<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Eyes Style Interstellar Simulator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #020408;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* NASA Style Floating Top Bar */
    nav {
      background: rgba(10, 15, 26, 0.75);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .brand-title {
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title::before {
      content: "•";
      color: #ef4444;
      font-size: 1.5rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .nav-btn {
      background: rgba(14, 116, 144, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-btn:hover { background: #0284c7; color: #fff; box-shadow: 0 0 12px rgba(56,189,248,0.5); }

    #simulator-container {
      position: relative;
      flex: 1;
      width: 100vw;
      background: #020408;
      overflow: hidden;
    }

    canvas#space-canvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
    }

    /* Glassmorphism HUD Panels */
    .hud-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      pointer-events: none;
    }

    .hud-panels {
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      gap: 20px;
      align-items: flex-end;
    }

    .panel {
      background: rgba(11, 18, 33, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 18px;
      border-radius: 12px;
      pointer-events: auto;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .panel h3 {
      font-size: 0.75rem;
      margin-bottom: 12px;
      color: #94a3b8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .metric-val {
      font-weight: 600;
      color: #38bdf8;
      font-family: monospace;
    }

    .control-btn {
      background: rgba(15, 23, 42, 0.8);
      color: #f1f5f9;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 14px;
      margin: 5px 0;
      cursor: pointer;
      width: 100%;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #38bdf8;
    }

    select.target-select {
      width: 100%;
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 10px;
      font-family: inherit;
      margin-bottom: 12px;
      border-radius: 6px;
      outline: none;
    }

    .spec-box {
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 10px;
    }

    /* Reticle Indicator */
    .reticle-overlay {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 220px; height: 220px;
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 50%;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

<nav>
  <div class="brand-title">NASA EYES SIMULATION ENGINE • Astra Deck</div>
  <a href="index.html" class="nav-btn">← Back to Presentation</a>
</nav>

<div id="simulator-container">
  <canvas id="space-canvas"></canvas>
  <div class="reticle-overlay" id="reticle"></div>

  <div class="hud-layer">
    <div style="text-align: center; pointer-events: none;">
      <div id="status-banner" style="font-size: 0.85rem; letter-spacing: 2px; color: #38bdf8; text-transform: uppercase;">
        ORBITAL TRACKING ACTIVE • REAL-TIME RENDER
      </div>
    </div>

    <div class="hud-panels">
      <!-- Telemetry Panel -->
      <div class="panel">
        <h3>Target Telemetry</h3>
        <div class="metric-row"><span>BODY:</span> <span class="metric-val" id="target-name">Earth</span></div>
        <div class="metric-row"><span>VIEW MODE:</span> <span class="metric-val" id="flight-mode">ORBITAL</span></div>
        <div class="metric-row"><span>ALTITUDE:</span> <span class="metric-val" id="alt-val">400.0 km</span></div>
        <div class="metric-row"><span>VELOCITY:</span> <span class="metric-val" id="speed-val">24.10 km/s</span></div>
        
        <div class="spec-box" id="spec-text">
          Nitrogen-oxygen atmosphere with active ocean currents.
        </div>
      </div>

      <div></div>

      <!-- Selector Panel -->
      <div class="panel">
        <h3>Destination Selector</h3>
        <select class="target-select" id="destinationSelect" onchange="changeTarget()">
          <optgroup label="Inner Solar System">
            <option value="Mercury">Mercury</option>
            <option value="Venus">Venus</option>
            <option value="Earth" selected>Earth</option>
            <option value="Luna">Luna (Earth Moon)</option>
            <option value="Mars">Mars</option>
            <option value="Phobos">Phobos</option>
            <option value="Deimos">Deimos</option>
          </optgroup>
          <optgroup label="Outer Solar System">
            <option value="Jupiter">Jupiter</option>
            <option value="Io">Io</option>
            <option value="Europa">Europa</option>
            <option value="Ganymede">Ganymede</option>
            <option value="Callisto">Callisto</option>
            <option value="Saturn">Saturn</option>
            <option value="Titan">Titan</option>
            <option value="Enceladus">Enceladus</option>
            <option value="Uranus">Uranus</option>
            <option value="Neptune">Neptune</option>
          </optgroup>
          <optgroup label="Deep Space">
            <option value="Andromeda">Andromeda (M31)</option>
            <option value="Triangulum">Triangulum (M33)</option>
          </optgroup>
        </select>

        <button class="control-btn" onclick="toggleWarp()"><span>Warp Approach</span> <span>🚀</span></button>
        <button class="control-btn" onclick="initiateLanding()"><span>Atmospheric Entry</span> <span>🛬</span></button>
        <button class="control-btn" onclick="ascentToOrbit()"><span>Ascent to Orbit</span> <span>🛰️</span></button>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('space-canvas');
  const ctx = canvas.getContext('2d');

  let width, height;
  function resize() {
    const container = document.getElementById('simulator-container');
    width = canvas.width = container.clientWidth;
    height = canvas.height = container.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const bodySpecs = {
    Mercury: { baseColor: '#8c8c8c', atmosphereColor: 'rgba(200,200,200,0.1)', terrainColor: '#4a4a4a', radius: 180, desc: 'Extreme cratering and iron core composition.' },
    Venus: { baseColor: '#e3a857', atmosphereColor: 'rgba(255,215,100,0.4)', terrainColor: '#a66011', radius: 240, desc: 'Opaque cloud deck composed of sulfuric acid drops.' },
    Earth: { baseColor: '#1d4ed8', atmosphereColor: 'rgba(56,189,248,0.5)', terrainColor: '#15803d', radius: 250, desc: 'Nitrogen-oxygen atmosphere with active ocean currents.' },
    Luna: { baseColor: '#64748b', atmosphereColor: 'rgba(148,163,184,0.1)', terrainColor: '#334155', radius: 130, desc: 'Silicate highland regolith and dark volcanic maria.' },
    Mars: { baseColor: '#c2410c', atmosphereColor: 'rgba(251,146,60,0.3)', terrainColor: '#7c2d12', radius: 200, desc: 'Dust storms, Valles Marineris canyon, and polar ice.' },
    Phobos: { baseColor: '#475569', atmosphereColor: 'rgba(255,255,255,0.05)', terrainColor: '#1e293b', radius: 80, desc: 'Grooved carbonaceous potato-shaped moon.' },
    Deimos: { baseColor: '#334155', atmosphereColor: 'rgba(255,255,255,0.05)', terrainColor: '#0f172a', radius: 60, desc: 'Smooth outer satellite covered in thick regolith.' },
    Jupiter: { baseColor: '#d97706', atmosphereColor: 'rgba(251,191,36,0.3)', terrainColor: '#b45309', radius: 340, desc: 'Dynamic zonal cloud bands and Great Red Spot storm.' },
    Io: { baseColor: '#eab308', atmosphereColor: 'rgba(234,179,8,0.3)', terrainColor: '#854d0e', radius: 140, desc: 'Active silicate vulcanism triggered by tidal flexing.' },
    Europa: { baseColor: '#38bdf8', atmosphereColor: 'rgba(186,230,253,0.5)', terrainColor: '#0284c7', radius: 140, desc: 'Subsurface ocean beneath fractured water ice shell.' },
    Ganymede: { baseColor: '#475569', atmosphereColor: 'rgba(148,163,184,0.2)', terrainColor: '#334155', radius: 170, desc: 'Grooved terrain over intrinsic magnetosphere core.' },
    Callisto: { baseColor: '#1e293b', atmosphereColor: 'rgba(100,116,139,0.2)', terrainColor: '#0f172a', radius: 160, desc: 'Ancient ice-rock surface densely covered in craters.' },
    Saturn: { baseColor: '#f59e0b', atmosphereColor: 'rgba(252,211,77,0.3)', terrainColor: '#b45309', radius: 300, rings: true, desc: 'Prominent ring system composed of water ice chunks.' },
    Titan: { baseColor: '#ea580c', atmosphereColor: 'rgba(249,115,22,0.6)', terrainColor: '#9a3412', radius: 160, desc: 'Dense orange nitrogen atmosphere with methane lakes.' },
    Enceladus: { baseColor: '#f8fafc', atmosphereColor: 'rgba(241,245,249,0.7)', terrainColor: '#cbd5e1', radius: 110, desc: 'Cryovolcanic plumes shooting ocean water into space.' },
    Uranus: { baseColor: '#06b6d4', atmosphereColor: 'rgba(103,232,249,0.4)', terrainColor: '#0e7490', radius: 260, rings: true, desc: 'Extreme 98-degree axial tilt and cyan methane atmosphere.' },
    Neptune: { baseColor: '#2563eb', atmosphereColor: 'rgba(96,165,250,0.5)', terrainColor: '#1d4ed8', radius: 250, rings: true, desc: 'Fastest planetary winds in Solar System.' },
    Andromeda: { baseColor: '#fef08a', atmosphereColor: 'rgba(254,240,138,0.4)', terrainColor: '#1e1b4b', radius: 320, desc: 'Barred spiral galaxy M31 containing 1 trillion stars.' },
    Triangulum: { baseColor: '#bae6fd', atmosphereColor: 'rgba(186,230,253,0.4)', terrainColor: '#0c4a6e', radius: 280, desc: 'Spiral galaxy M33 with active star-forming nebulae.' }
  };

  let activeTarget = 'Earth';
  let flightMode = 'ORBITAL';
  let altitude = 400.0;
  let isWarping = false;

  // Starfield
  const stars = Array.from({ length: 500 }, () => ({
    x: (Math.random() - 0.5) * 2000,
    y: (Math.random() - 0.5) * 2000,
    z: Math.random() * 2000,
    size: Math.random() * 1.5 + 0.5
  }));

  function drawBackgroundStars() {
    ctx.fillStyle = isWarping ? '#38bdf8' : '#ffffff';
    for (let s of stars) {
      s.z -= isWarping ? 40 : 0.5;
      if (s.z <= 0) s.z = 2000;

      let k = 256 / s.z;
      let px = s.x * k + width / 2;
      let py = s.y * k + height / 2;

      if (px >= 0 && px <= width && py >= 0 && py <= height) {
        ctx.beginPath();
        ctx.arc(px, py, s.size * (isWarping ? 2 : 1), 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawCelestialBody() {
    const spec = bodySpecs[activeTarget];

    // SURFACE LANDED VIEW MODE
    if (flightMode === 'LANDED') {
      document.getElementById('reticle').style.opacity = '0';

      // Sky Gradient
      let skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.7);
      skyGrad.addColorStop(0, '#020408');
      skyGrad.addColorStop(1, spec.baseColor);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height * 0.7);

      // Surface Terrain Ground
      ctx.fillStyle = spec.terrainColor;
      ctx.beginPath();
      ctx.ellipse(width / 2, height + 100, width * 0.8, height * 0.45, 0, Math.PI, 0);
      ctx.fill();
      return;
    }

    // ORBITAL & DESCENT VIEW MODES
    document.getElementById('reticle').style.opacity = '1';

    let cx = width / 2;
    // Shift body downward as altitude decreases
    let targetY = height / 2 + (400 - altitude) * 0.8;

    ctx.save();
    ctx.translate(cx, targetY);

    // Orbit Guide Lines
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.15)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.ellipse(0, 0, spec.radius + 120, (spec.radius + 120) * 0.4, 0.3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Atmosphere Glow
    let glow = ctx.createRadialGradient(0, 0, spec.radius * 0.8, 0, 0, spec.radius + 40);
    glow.addColorStop(0, spec.atmosphereColor);
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, spec.radius + 40, 0, Math.PI * 2);
    ctx.fill();

    // Planet Body Sphere
    let grad = ctx.createRadialGradient(-spec.radius * 0.3, -spec.radius * 0.3, 10, 0, 0, spec.radius);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, spec.baseColor);
    grad.addColorStop(1, '#020617');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, spec.radius, 0, Math.PI * 2);
    ctx.fill();

    // Rings
    if (spec.rings) {
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.4)';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.ellipse(0, 0, spec.radius + 90, 24, -0.2, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#020408';
    ctx.fillRect(0, 0, width, height);

    drawBackgroundStars();
    drawCelestialBody();

    // Smooth descent handling during entry
    if (flightMode === 'LANDING') {
      if (altitude > 0) {
        altitude = Math.max(0, altitude - 3.0);
        updateUI();
      } else {
        flightMode = 'LANDED';
        document.getElementById('status-banner').innerText = "TOUCHDOWN CONFIRMED • SURFACE RECON ACTIVE";
        updateUI();
      }
    }

    requestAnimationFrame(render);
  }

  render();

  function changeTarget() {
    activeTarget = document.getElementById('destinationSelect').value;
    flightMode = 'ORBITAL';
    altitude = 400.0;
    document.getElementById('status-banner').innerText = `APPROACHING ${activeTarget.toUpperCase()}`;
    updateUI();
  }

  function toggleWarp() {
    isWarping = true;
    document.getElementById('status-banner').innerText = "WARP DRIVE ENGAGED";
    setTimeout(() => {
      isWarping = false;
      document.getElementById('status-banner').innerText = "ORBITAL TRACKING ACTIVE • REAL-TIME RENDER";
    }, 2000);
  }

  function initiateLanding() {
    if (flightMode === 'LANDED') return;
    flightMode = 'LANDING';
    document.getElementById('status-banner').innerText = "ATMOSPHERIC ENTRY & DESCENT IN PROGRESS";
  }

  function ascentToOrbit() {
    flightMode = 'ORBITAL';
    altitude = 400.0;
    document.getElementById('status-banner').innerText = "STABLE ORBIT ACHIEVED";
    updateUI();
  }

  function updateUI() {
    const spec = bodySpecs[activeTarget];
    document.getElementById('target-name').innerText = activeTarget;
    document.getElementById('flight-mode').innerText = flightMode;
    document.getElementById('alt-val').innerText = `${altitude.toFixed(1)} km`;
    document.getElementById('spec-text').innerText = spec.desc;
  }
</script>
</body>
</html>
