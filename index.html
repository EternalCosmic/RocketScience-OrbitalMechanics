<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Science & Orbital Mechanics - Presentation Deck</title>
    <style>
        :root {
            --bg-dark: #040711;
            --card-bg: #0b1120;
            --card-border: #1d293d;
            --accent-blue: #00d2ff;
            --accent-purple: #9d4edd;
            --accent-cyan: #38ef7d;
            --accent-orange: #ff9f43;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--card-border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-btn {
            background: #162032;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #202d44;
            border-color: var(--accent-blue);
        }

        .nav-btn.active {
            background: var(--accent-blue);
            color: #040711;
            font-weight: 600;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            flex: 1;
        }

        @media (min-width: 1100px) {
            .dashboard-container {
                grid-template-columns: 1fr 1.3fr 1fr;
            }
        }

        .dash-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .slide-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
